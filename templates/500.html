{% extends "base.html" %}

{% block title %}500 Internal Server Error | UniEnroll{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="glass-card p-5 rounded-4 shadow-lg bg-white">
            <div class="display-1 text-danger fw-bold mb-3">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>500
            </div>
            <h2 class="fw-bold text-dark mb-2">Internal Server Error</h2>
            <p class="text-muted mb-4">
                An unexpected system exception occurred. Our technical engineering team has been notified.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'home' %}" class="btn btn-primary px-4 rounded-pill fw-bold">
                    <i class="fa-solid fa-rotate-left me-1"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
